name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q main.py ssdm tests
      - name: Smoke-test application imports
        run: python -c "from ssdm.app import MainWindow; from ssdm.video import VideoDownloadJob; from ssdm.uploader import UploadJob; from ssdm.sftp_uploader import SFTPUploadJob; from ssdm.ftp_uploader import FTPUploadJob"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

# The Windows EXE packaging/release workflow will be added back only after
# the feature set is implemented and the test suite is green.
