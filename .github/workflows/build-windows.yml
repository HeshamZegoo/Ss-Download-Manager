name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q main.py ssdm tests
      - name: Smoke-test application imports
        run: python -c "from ssdm.app import MainWindow; from ssdm.video import VideoDownloadJob; from ssdm.uploader import UploadJob; from ssdm.sftp_uploader import SFTPUploadJob; from ssdm.ftp_uploader import FTPUploadJob; from ssdm.tus_uploader import TusUploadJob"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  build-windows-exe:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build desktop application EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SsDownloadManager
          --collect-all yt_dlp
          --collect-all paramiko
          --collect-all requests
          --collect-all certifi
          --collect-all PySide6.QtWebEngineCore
          --collect-all PySide6.QtWebEngineWidgets
          --collect-all PySide6.QtWebChannel
          --add-data "ssdm/ui/idm-modern.html;ssdm/ui"
          main.py
      - name: Build browser native-messaging host
        run: pyinstaller --noconfirm --onefile --console --name ssdm-native-host ssdm/native_host.py
      - name: Package browser extensions and installer
        shell: pwsh
        run: |
          ./tools/package-browser-extensions.ps1
          Copy-Item browser/install-browser-host.ps1 dist/browser-extensions/
          Copy-Item COPYRIGHT.txt dist/
          @"
          Ss Download Manager - Windows setup
          Run Ss-Download-Manager-Setup.exe. The installer installs the app, native messaging host,
          and browser integration files. It registers the native bridge for Chrome, Edge, Brave, and Firefox.
          For Chromium browsers, enable Developer mode and choose Load unpacked from the installed
          browser\\chromium folder. Firefox requires temporary add-on loading unless the extension
          is signed and published by Mozilla. See Browser-Setup.txt after installation.
          "@ | Set-Content dist/README-Install.txt
      - name: Build Windows setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path $env:ProgramFiles(x86) "Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer/SsDownloadManager.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } |
            Set-Content dist/SHA256SUMS.txt
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: Ss-Download-Manager-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
