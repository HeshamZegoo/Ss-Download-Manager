name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "Ss Download Manager"
          --collect-all PySide6
          main.py
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/Ss Download Manager/*" -DestinationPath "Ss-Download-Manager-Windows-x64.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ss-Download-Manager-Windows-x64
          path: Ss-Download-Manager-Windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ss-Download-Manager-Windows-x64.zip
